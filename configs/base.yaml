seed: 42

data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed

embedding:
  model_name: BAAI/bge-m3   # dense 1024-dim, multilingual (plan.cv.md §10)
  dim: 1024
  device: cpu
  frozen: true

sections:
  # rule-based section names used for splitting CV/JD
  skills: ["kỹ năng", "skills"]
  experience: ["kinh nghiệm", "experience"]
  education: ["học vấn", "education"]
  summary: ["tóm tắt", "summary"]

matching:
  method: section_aware   # bm25 | single_vector | chunk_max_sim | section_aware
  pairing: cross           # fixed | cross
  aggregation: max         # max | mean

retrieval:
  pool_size: 100           # candidate pool từ full-text vector
  top_k: 10
  status: READY
  keyword_alpha: 0.5       # trọng số semantic khi fusion với keyword (B5)

ranking:
  # S_hybrid = Σ w_i * S_i, chuẩn hoá [0,1] (plan §7.2)
  weights:
    semantic: 0.40
    skills: 0.30
    experience: 0.15
    budget: 0.10
    preferences: 0.05
